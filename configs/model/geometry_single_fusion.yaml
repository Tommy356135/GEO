model_name: Geometry-SingleFusion-Ablation
backbone: MinkUNet34C
baseline_input_dim: 6
geometry_input_dim: 12
geometry_embedding_dim: 16
geometry_encoder:
  hidden_dim: 32
  output_dim: 16
  normalization: LayerNorm
  activation: ReLU
  dropout: 0.0
geometry_definition_version: geomorph_geometry_v2
geometry_scales:
  small_k: 16
  large_k: 64
fusion:
  type: residual_gate
  locations:
    - encoder1
